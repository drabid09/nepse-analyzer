name: Weekly backtest

# Tests the daily rules on about three years of history: the signal strategy
# after costs and tax, what followed each kind of call, and how often the price
# ranges held. The daily job uses the results to weight and widen its ranges.

on:
  schedule:
    - cron: "30 4 * * 6"      # Saturdays 10:15 Nepal time
  workflow_dispatch:
    inputs:
      timer:
        description: "Started by the Supabase timer: behave like a scheduled run"
        type: boolean
        default: false
  push:
    branches: ["phase-3/**"]
    paths:
      - "scripts/analytics/backtest.py"
      - "scripts/analytics/engine.py"
      - ".github/workflows/backtest-weekly.yml"

permissions:
  contents: read

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Kathmandu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/analytics/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/analytics/requirements.txt

      - name: Backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/analytics/backtest.py
