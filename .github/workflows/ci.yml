name: Tests

# Runs every test on each pull request and each change to main, so a broken
# rule, check or page is caught before or as it reaches the live site.
# Needs no secrets: the database tests use a throwaway Postgres started here.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Jobs, data checks and database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TZ: Asia/Kathmandu
      PG_ADMIN_DSN: host=localhost port=5432 user=postgres password=postgres dbname=postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            scripts/analytics/requirements.txt
            tests/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/analytics/requirements.txt -r tests/requirements.txt

      - name: Run tests
        run: pytest tests -q -rs

  web:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Logic tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
