name: Daily analytics

# Data checks, then signals and price ranges for the latest final trading day.
# Starts as soon as the end-of-day workflow finishes (on the default branch),
# with scheduled backups that do nothing once the day's signals exist.
# Times are UTC; Nepal is UTC+05:45.

on:
  workflow_run:
    workflows: ["End of day"]
    types: [completed]
  schedule:
    - cron: "5 10 * * 1-5"    # 15:50 Nepal time
    - cron: "35 11 * * 1-5"   # 17:20 backup (also flags a missing end-of-day)
    - cron: "55 13 * * 1-5"   # 19:40 backup
  workflow_dispatch:
    inputs:
      timer:
        description: "Started by the Supabase timer: behave like a scheduled run"
        type: boolean
        default: false
  push:
    branches: ["phase-3/**"]
    paths:
      - "scripts/analytics/**"
      - ".github/workflows/analytics-daily.yml"

permissions:
  contents: read

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Kathmandu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/analytics/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/analytics/requirements.txt

      - name: Check data, compute signals and ranges
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # A timer-started run skips work already done; one started by hand redoes it.
          RUN_BY_TIMER: ${{ inputs.timer && '1' || '' }}
        run: python scripts/analytics/daily_analytics.py
