name: Company details (rotating)

# Refreshes ISIN, listing date, shares, paid-up capital, market cap and the
# promoter/public split for ~110 companies per run, oldest first, with a pause
# between requests. Daily after the close: every company about once a week.
# Times are UTC; Nepal is UTC+05:45.

on:
  schedule:
    - cron: "33 11 * * 0-5"   # 17:18 Nepal time, Sunday to Friday
  workflow_dispatch:
    inputs:
      timer:
        description: "Started by the Supabase timer: behave like a scheduled run"
        type: boolean
        default: false
      batch:
        description: "Companies to refresh (110 a day; up to 600 to catch up, about 3 s each)"
        type: number
        default: 110
  push:
    branches: ["phase-2/**"]
    paths:
      - "scripts/ingest/company_details.py"
      - ".github/workflows/company-details.yml"

permissions:
  contents: read

concurrency:
  group: company-details
  cancel-in-progress: false

jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # a 600-company catch-up takes about 31 minutes
    env:
      TZ: Asia/Kathmandu
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/ingest/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/ingest/requirements.txt

      - name: Refresh company details
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DETAILS_BATCH: ${{ inputs.batch || 110 }}
        run: python scripts/ingest/company_details.py
