name: Company details (rotating)

# Refreshes ISIN, listing date, shares, paid-up capital, market cap and the
# promoter/public split for ~110 companies per run, oldest first, with a pause
# between requests. Daily after the close: every company about once a week.
# Times are UTC; Nepal is UTC+05:45.

on:
  schedule:
    - cron: "33 11 * * 0-5"   # 17:18 Nepal time, Sunday to Friday
  workflow_dispatch:
  push:
    branches: ["phase-2/**"]
    paths:
      - "scripts/ingest/company_details.py"
      - ".github/workflows/company-details.yml"

permissions:
  contents: read

concurrency:
  group: company-details
  cancel-in-progress: false

jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Kathmandu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/ingest/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/ingest/requirements.txt

      - name: Refresh company details
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/ingest/company_details.py
