name: Weekly backup

# Exports the data that cannot be fetched again (scripts/analytics/backup.py)
# and keeps it as this run's artifact for 90 days. Restore steps are in
# docs/phase5-quality.md. Times are UTC; Nepal is UTC+05:45.

on:
  schedule:
    - cron: "25 14 * * 6"   # Saturdays 20:10 Nepal time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Kathmandu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/analytics/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/analytics/requirements.txt

      - name: Export
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/analytics/backup.py backup

      - name: Keep for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: nepse-backup-${{ github.run_number }}
          path: backup/
          retention-days: 90
          if-no-files-found: error
