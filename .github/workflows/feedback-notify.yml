name: Feedback

# Every 30 minutes: for each new message from the dashboard's feedback page,
# open a GitHub issue that tags the owner (GitHub then emails them). The issue
# never contains the message itself, because this repository is public; the
# message stays in the database. Times are UTC; Nepal is UTC+05:45.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      timer:
        description: "Started by the Supabase timer: behave like a scheduled run"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: feedback
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Kathmandu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/analytics/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/analytics/requirements.txt

      - name: Notify new feedback
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/analytics/feedback_notify.py
