name: End of day

# Finalises the day's prices, floorsheet summary, indices and market totals
# after the 15:00 close. Times are UTC; Nepal is UTC+05:45. The backups do
# nothing when the day is already final, so a late or skipped main run is
# covered without repeating NEPSE requests.

on:
  schedule:
    - cron: "35 9 * * 1-5"    # 15:20 Nepal time
    - cron: "55 10 * * 1-5"   # 16:40 backup
    - cron: "25 13 * * 1-5"   # 19:10 backup
  workflow_dispatch:
  push:
    branches: ["phase-2/**"]
    paths:
      - "scripts/ingest/eod_market.py"
      - ".github/workflows/market-eod.yml"

permissions:
  contents: read

concurrency:
  group: market-eod
  cancel-in-progress: false

jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kathmandu   # the NEPSE library builds its request ids from today's date
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/ingest/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/ingest/requirements.txt

      - name: Finalise the day
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/ingest/eod_market.py
